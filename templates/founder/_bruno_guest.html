{% load static %}
{% comment %}
    Бруно для гостевых страниц (заставка, вход, регистрация): у гостя нет проекта и гардероба.
    pose='walk' — Бруно идёт (заставка), иначе машет. Дальше позами управляет bruno.js.
{% endcomment %}
<div class="bruno-art bruno-reference bruno-curious" data-pose="{{ pose|default:'wave' }}">
    <svg class="bruno-stage"
         viewBox="0 0 300 300"
         xmlns="http://www.w3.org/2000/svg"
         role="img"
         aria-label="Бруно, ваш наставник"
         focusable="false">
        <g class="bruno-character">
            {% if pose == 'walk' %}
                <svg x="16"
                     y="2"
                     width="268"
                     height="290"
                     viewBox="990 738 236 256"
                     overflow="hidden">
                    <defs>
                        <filter id="bruno-walk-edge-{{ instance_id|default:'guest' }}"
                                x="990" y="738" width="236" height="256"
                                filterUnits="userSpaceOnUse" color-interpolation-filters="sRGB">
                            <feComponentTransfer in="SourceAlpha" result="solid-alpha">
                                <feFuncA type="linear" slope="1.25" intercept="-0.15" />
                            </feComponentTransfer>
                            <feMorphology in="solid-alpha" operator="erode" radius="1" result="clean-alpha" />
                            <feComposite in="SourceGraphic" in2="clean-alpha" operator="in" />
                        </filter>
                    </defs>
                    <image href="{% static 'founder/img/bruno-sprite.webp' %}"
                           width="1280"
                           height="1066"
                           filter="url(#bruno-walk-edge-{{ instance_id|default:'guest' }})" />
                </svg>
            {% else %}
                <svg x="10"
                     y="0"
                     width="280"
                     height="295"
                     viewBox="30 25 680 690"
                     overflow="hidden">
                    <defs><clipPath id="bruno-guest-{{ instance_id|default:'guest' }}">
                    <path d="M30 25 H635 V295 H705 V485 H625 V720 H30 Z" />
                    </clipPath></defs>
                    <image href="{% static 'founder/img/bruno-sprite.webp' %}"
                           width="1280"
                           height="1066"
                           clip-path="url(#bruno-guest-{{ instance_id|default:'guest' }})" />
                </svg>
            {% endif %}
        </g>
    </svg>
</div>
