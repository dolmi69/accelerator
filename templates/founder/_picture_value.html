<div class="picture-value" id="picture-value">
    <strong>Ценность</strong>
    {% if picture.value %}
        <p>{{ picture.value }}</p>
    {% else %}
        <p class="muted small">Пока не сформулирована.</p>
    {% endif %}
    {% if can_edit %}
        <form method="post" action="{% url 'value_generate' startup.id %}" data-busy-form>
            {% csrf_token %}
            <button type="submit" class="button ghost wide" data-busy-label="Бруно формулирует ценность…">Сформулировать ценность</button>
            <span class="muted small" role="status"></span>
        </form>
    {% endif %}
    <a class="evidence-link" href="{% url 'value' startup.id %}">Сегменты ABCDX и брейншторм →</a>
</div>
