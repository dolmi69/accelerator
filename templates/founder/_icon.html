{% comment %}
    Иконки интерфейса вместо символов и эмодзи: обводка 1.7, скруглённые концы, сетка 24 px.
    Использование: {% include 'founder/_icon.html' with name='chevron-down' %}
{% endcomment %}
<svg class="icon icon-{{ name }}"
     viewBox="0 0 24 24"
     fill="none"
     stroke="currentColor"
     stroke-width="1.7"
     stroke-linecap="round"
     stroke-linejoin="round"
     aria-hidden="true"
     focusable="false">
    {% if name == 'sections' %}
        <rect x="3.5" y="4.5" width="17" height="15" rx="2.5" />
        <path d="M9.5 4.5v15M5.8 8.5h1.4M5.8 11.5h1.4" />
    {% elif name == 'chevron-down' %}
        <path d="m6 9.5 6 6 6-6" />
    {% elif name == 'chevron-right' %}
        <path d="m9.5 6 6 6-6 6" />
    {% elif name == 'check' %}
        <path d="m5 12.5 4.5 4.5L19 7.5" />
    {% elif name == 'arrow-up-right' %}
        <path d="M7.5 16.5 16.5 7.5M9 7.5h7.5V15" />
    {% elif name == 'coin' %}
        <circle cx="12" cy="12" r="8.5" fill="#f6c768" />
        <circle cx="12" cy="12" r="5" />
    {% elif name == 'paperclip' %}
        <path d="m19.5 11.5-7.4 7.4a4.8 4.8 0 0 1-6.8-6.8l8-8a3.2 3.2 0 0 1 4.5 4.5l-8 8a1.6 1.6 0 0 1-2.3-2.3l7.3-7.3" />
    {% elif name == 'copy' %}
        <rect x="8.5" y="8.5" width="11" height="11" rx="2.5" />
        <path d="M15.5 8.5V6.5a2 2 0 0 0-2-2h-7a2 2 0 0 0-2 2v7a2 2 0 0 0 2 2h2" />
    {% elif name == 'link' %}
        <path d="M10.5 13.5a3.8 3.8 0 0 0 5.4 0l3-3a3.8 3.8 0 0 0-5.4-5.4l-1.2 1.2" />
        <path d="M13.5 10.5a3.8 3.8 0 0 0-5.4 0l-3 3a3.8 3.8 0 0 0 5.4 5.4l1.2-1.2" />
    {% elif name == 'search' %}
        <circle cx="11" cy="11" r="6.5" />
        <path d="m20 20-4.4-4.4" />
    {% elif name == 'plus' %}
        <path d="M12 5v14M5 12h14" />
    {% elif name == 'alert' %}
        <path d="M12 4.5 20.5 19h-17Z" />
        <path d="M12 10v4M12 16.8v.1" />
    {% elif name == 'thumb-up' %}
        <path d="M8 10.5v9H5.5a1 1 0 0 1-1-1v-7a1 1 0 0 1 1-1Zm0 0 3.6-6a1.8 1.8 0 0 1 3.3 1.3l-.7 3.7h4.3a1.8 1.8 0 0 1 1.8 2.1l-1.2 6.6a2 2 0 0 1-2 1.8H8" />
    {% elif name == 'thumb-down' %}
        <path d="M8 13.5v-9H5.5a1 1 0 0 0-1 1v7a1 1 0 0 0 1 1Zm0 0 3.6 6a1.8 1.8 0 0 0 3.3-1.3l-.7-3.7h4.3a1.8 1.8 0 0 0 1.8-2.1l-1.2-6.6a2 2 0 0 0-2-1.8H8" />
    {% elif name == 'close' %}
        <path d="m7 7 10 10M17 7 7 17" />
    {% endif %}
</svg>
