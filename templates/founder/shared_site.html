<!doctype html>
<html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>{{ schema.title }}</title>
<style nonce="{{ nonce }}">
*{box-sizing:border-box}body{font:1rem/1.45 system-ui,sans-serif;color:#182d33;background:#f5f7f6;margin:0}
main{max-width:60rem;margin:auto;padding:clamp(1rem,4vw,3rem)}header,nav,.row{display:flex;gap:.75rem;align-items:center;flex-wrap:wrap}
header{justify-content:space-between}h1{font-size:clamp(1.6rem,4vw,2.5rem);margin:.5em 0}
section,article{background:white;border:1px solid #dbe5e0;border-radius:12px;padding:1.2rem;margin:1rem 0}
form{display:grid;gap:.8rem;max-width:35rem}label{display:grid;gap:.25rem}input,select,button{font:inherit;padding:.6rem;border:1px solid #829c93;border-radius:6px}
button{background:white;color:#154c42;cursor:pointer}button[type=submit],button[aria-current=true]{background:#15594c;color:white}
body[data-theme=blue]{--accent:#234e82}body[data-theme=plum]{--accent:#653756}body[data-theme=graphite]{--accent:#364452}
button[type=submit],button[aria-current=true]{background:var(--accent,#15594c)}
button:disabled{opacity:.55}dl{display:grid;grid-template-columns:minmax(6rem,1fr) 2fr;gap:.4rem}dd{margin:0;overflow-wrap:anywhere}
#notice{color:#873700}img{max-width:100%;max-height:12rem}nav{margin:.75rem 0}[hidden]{display:none!important}
</style></head><body data-theme="{{ schema.theme|default:'green' }}"><main data-root="{{ root }}" data-csrf="{{ csrf }}">
<header><h1>{{ schema.title }}</h1><div id="session"></div></header>
<p role="status" id="notice"></p><nav id="tables" aria-label="Разделы"></nav><div id="workspace"></div>
</main>{{ schema|json_script:"definition" }}
<script nonce="{{ nonce }}">{% include "founder/_shared_site.js" %}</script></body></html>
