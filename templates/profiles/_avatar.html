<span class="member-avatar {{ avatar_class }}"
      {% if vt_name %}style="view-transition-name: {{ vt_name }}"{% endif %}
      aria-hidden="true">
    {% if member.avatar %}
        <img src="{{ member.avatar_url }}"
             alt=""
             loading="lazy"
             width="80"
             height="80">
    {% else %}
        {{ member.public_name|first|upper }}
    {% endif %}
</span>
