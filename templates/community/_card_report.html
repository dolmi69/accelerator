{% if card.startup.owner_id != request.user.pk %}{% if card.reported_by_me %}<span class="report-button is-reported" role="img" aria-label="Вы пожаловались на эту карточку" title="Вы пожаловались на эту карточку"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><circle cx="12" cy="12" r="9.5"/><path d="M12 7v6"/><path d="M12 16.6v.1"/></svg></span>{% else %}<form method="post" action="{% url 'card_report' card.startup_id %}" class="report-form" data-report-form data-card-name="{{ name }}">{% csrf_token %}<input type="hidden" name="next" value="{{ request.get_full_path }}"><button type="submit" class="report-button" aria-label="Пожаловаться на карточку «{{ name }}»" title="Пожаловаться на карточку"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><circle cx="12" cy="12" r="9.5"/><path d="M12 7v6"/><path d="M12 16.6v.1"/></svg></button></form>{% endif %}{% endif %}
