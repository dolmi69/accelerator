{% if page.has_other_pages %}<nav class="pagination" aria-label="Страницы">
{% if page.has_previous %}<a href="{% querystring page=page.previous_page_number %}">← Назад</a>{% endif %}
<span>{{ page.number }} из {{ page.paginator.num_pages }}</span>
{% if page.has_next %}<a href="{% querystring page=page.next_page_number %}">Дальше →</a>{% endif %}</nav>{% endif %}
