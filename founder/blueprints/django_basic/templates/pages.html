{% extends 'base.html' %}{% block content %}<section class="card"><h1>Публикации</h1>{% if site_editor %}<a class="button" href="{% url 'page_create' %}">Новая публикация</a>{% endif %}{% for row in page %}<article class="tile"><h2><a href="{% url 'page' row.slug %}">{{ row.title }}</a></h2><p>{{ row.text|truncatechars:180 }}</p></article>{% empty %}<p>Публикаций пока нет.</p>{% endfor %}{% include 'pagination.html' %}</section>{% endblock %}
