{% extends 'base.html' %}{% block content %}<article class="card prose publication-detail"><a class="back-link" href="{% url 'pages' %}">{% include '_icon.html' with name='back' %}Все публикации</a><span class="eyebrow">{{ page.created_at|date:'d.m.Y' }}</span><h1>{{ page.title }}</h1><div class="section-divider">{{ page.text|linebreaks }}</div>{% if site_editor %}<div class="section-divider"><a class="button secondary" href="{% url 'page_edit' page.pk %}">Редактировать</a></div>{% endif %}</article>{% endblock %}
