<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Бруно куёт ваш сайт</title>
<style>
/* ============================================================
   Страница-демо. Сам компонент — блок .forge ниже.
   ============================================================ */
*{box-sizing:border-box}
html,body{margin:0}
body{
  min-height:100dvh;padding:24px 16px;display:grid;place-items:center;place-content:center;gap:12px;
  background:#f5f4ef;color:#203640;
  font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
}
/* Рамку можно тянуть за правый нижний угол: проверка ширины 280–600 px */
.demo-frame{
  width:min(100%,520px);min-width:280px;max-width:600px;
  resize:horizontal;overflow:hidden;
  border:1px solid #e1e4dc;border-radius:24px;background:#fff;
}
.demo-hint{font-size:11px;color:#8b928a;margin:0}

/* ============================================================
   КОМПОНЕНТ «МАСТЕРСКАЯ БРУНО»
   ============================================================ */
.forge{
  container-type:inline-size;
  display:flex;flex-direction:column;align-items:center;text-align:center;
  padding:20px 18px 26px;
  background:radial-gradient(ellipse 80% 60% at 50% 42%,#fff1df 0,#f8f5ee 58%,#f3f4ef 100%);
  color:#203640;
}
.forge-scene{width:100%;max-width:440px}
.forge-svg{display:block;width:100%;height:auto;overflow:visible}
.forge-title{margin:6px 0 6px;font-size:clamp(18px,6cqi,25px);line-height:1.2;font-weight:700;letter-spacing:-.01em}
.forge-text{margin:0;max-width:34ch;font-size:clamp(13px,3.6cqi,15px);line-height:1.55;color:#5f6f6b}

/* ============================================================
   АНИМАЦИЯ
   Один цикл = --cycle. Все дорожки (рука, тело, искры, свечение)
   используют одну длительность, поэтому проценты совпадают:
     0%      — отдача закончилась, молоток чуть над заготовкой
     0–40%   — подъём: сначала кисть «подворачивает» молоток, потом рука уходит вверх
     40–50%  — задержка наверху (лёгкий дозамах)
     50–66%  — удар с ускорением, кисть хлёстко догоняет в конце
     66%     — КОНТАКТ: все суставы = 0°, молоток стоит рабочей гранью на заготовке
     66–69%  — короткое касание
     69–100% — отдача и возврат
   Базовая геометрия руки нарисована сразу в позе удара, поэтому
   при rotate(0) грань бойка точно лежит на заготовке (y = 298, x = 146…178).
   ============================================================ */
/* Темп: меняйте только --cycle (1.6–2s), все дорожки останутся синхронны */
.forge-svg{--cycle:1.8s}
.forge-svg .rig{transform-box:view-box}

/* Корпус и рука с молотком двигаются вместе (одинаковая дорожка) */
.bruno-body,.arm-rig{transform-origin:211px 420px;animation:bruno-body var(--cycle) infinite}
.bruno-face{transform-origin:211px 180px;animation:bruno-face var(--cycle) infinite}
.ear-l{transform-origin:126px 114px;animation:ear-l var(--cycle) infinite}
.ear-r{transform-origin:296px 110px;animation:ear-r var(--cycle) infinite}

/* Суставы: плечо → локоть → кисть. Координаты = точки суставов в viewBox */
.arm-shoulder{transform-origin:102px 216px;animation:arm-shoulder var(--cycle) infinite}
.arm-forearm{transform-origin:71.6px 250.5px;animation:arm-forearm var(--cycle) infinite}
.hammer-wrist{transform-origin:106px 278px;animation:hammer-wrist var(--cycle) infinite}

/* Моргание: раз в три цикла, сразу после одного из ударов */
.eye-lid{animation:blink-lid calc(var(--cycle)*3) infinite}
.eye-closed{opacity:0;animation:blink-line calc(var(--cycle)*3) infinite}

/* Свет и металл */
.forge-light{animation:forge-light var(--cycle) infinite}
.hot-glow{transform-origin:162px 302px;animation:hot-glow var(--cycle) infinite}
.bar-flash{opacity:0;animation:bar-flash var(--cycle) infinite}

/* Вспышка и искры: рождаются в точке контакта (162, 298) */
.impact-ring,.impact-rays{transform-origin:162px 298px;opacity:0}
.impact-ring{animation:impact-ring var(--cycle) infinite}
.impact-rays{animation:impact-rays var(--cycle) infinite}
.spark{transform-box:fill-box;transform-origin:center;opacity:0;animation:spark var(--cycle) infinite}
.ember{transform-box:fill-box;transform-origin:center;opacity:0;animation:ember 3.1s linear infinite}
.ember:nth-of-type(2){animation-duration:3.9s;animation-delay:-1.4s}
.ember:nth-of-type(3){animation-duration:4.6s;animation-delay:-2.9s}

/* Плавности (вписаны прямо в кадры — var() внутри @keyframes для timing-function
   работает не везде):
   подъём/паузы  cubic-bezier(.45,0,.55,1)
   удар          cubic-bezier(.5,0,.75,.35)  — разгон к самому контакту
   хлёст кисти   cubic-bezier(.55,0,.85,.4)
   отдача        cubic-bezier(.15,.75,.35,1) — резко вверх и мягкое затухание */

@keyframes arm-shoulder{
  0%  {transform:rotate(8deg);  animation-timing-function:cubic-bezier(.45,0,.55,1)}
  40% {transform:rotate(84deg); animation-timing-function:cubic-bezier(.45,0,.55,1)}
  50% {transform:rotate(87deg); animation-timing-function:cubic-bezier(.5,0,.75,.35)}
  66% {transform:rotate(0deg);  animation-timing-function:linear}
  69% {transform:rotate(0deg);  animation-timing-function:cubic-bezier(.15,.75,.35,1)}
  100%{transform:rotate(8deg)}
}
@keyframes arm-forearm{
  0%  {transform:rotate(-16deg); animation-timing-function:cubic-bezier(.45,0,.55,1)}
  40% {transform:rotate(-206deg);animation-timing-function:cubic-bezier(.45,0,.55,1)}
  50% {transform:rotate(-211deg);animation-timing-function:cubic-bezier(.5,0,.75,.35)}
  66% {transform:rotate(0deg);   animation-timing-function:linear}
  69% {transform:rotate(0deg);   animation-timing-function:cubic-bezier(.15,.75,.35,1)}
  100%{transform:rotate(-16deg)}
}
@keyframes hammer-wrist{
  0%  {transform:rotate(-10deg);animation-timing-function:cubic-bezier(.45,0,.55,1)} /* после отдачи */
  16% {transform:rotate(-60deg);animation-timing-function:cubic-bezier(.45,0,.55,1)} /* кисть подворачивает молоток вверх */
  40% {transform:rotate(-6deg); animation-timing-function:cubic-bezier(.45,0,.55,1)} /* вершина замаха */
  50% {transform:rotate(-9deg); animation-timing-function:cubic-bezier(.45,0,.55,1)}
  58% {transform:rotate(-24deg);animation-timing-function:cubic-bezier(.55,0,.85,.4)} /* молоток отстаёт от руки… */
  66% {transform:rotate(0deg);  animation-timing-function:linear} /* …и хлёстко догоняет: контакт */
  69% {transform:rotate(0deg);  animation-timing-function:cubic-bezier(.15,.75,.35,1)}
  100%{transform:rotate(-10deg)}
}
/* При rotate(0)/translate(0) в 66–69% корпус в базовой позе — контакт не сбивается */
@keyframes bruno-body{
  0%  {transform:translateY(-1px) rotate(0deg);      animation-timing-function:cubic-bezier(.45,0,.55,1)}
  40% {transform:translateY(-2.5px) rotate(-.6deg);  animation-timing-function:cubic-bezier(.45,0,.55,1)}
  50% {transform:translateY(-3px) rotate(-.7deg);    animation-timing-function:cubic-bezier(.5,0,.75,.35)}
  66% {transform:translateY(0) rotate(0deg);         animation-timing-function:linear}
  69% {transform:translateY(0) rotate(0deg);         animation-timing-function:ease-out}
  75% {transform:translateY(1.2px) rotate(.25deg);   animation-timing-function:cubic-bezier(.45,0,.55,1)}
  100%{transform:translateY(-1px) rotate(0deg)}
}
@keyframes bruno-face{
  0%     {transform:translate(0,0);          animation-timing-function:cubic-bezier(.45,0,.55,1)}
  40%,50%{transform:translate(-.6px,-1.6px); animation-timing-function:cubic-bezier(.5,0,.75,.35)}
  66%    {transform:translate(0,0);          animation-timing-function:ease-out}
  72%    {transform:translate(.4px,2px);     animation-timing-function:cubic-bezier(.45,0,.55,1)}
  86%    {transform:translate(0,.4px);       animation-timing-function:cubic-bezier(.45,0,.55,1)}
  100%   {transform:translate(0,0)}
}
@keyframes ear-l{
  0%,40%{transform:rotate(0)} 50%{transform:rotate(2deg)} 66%{transform:rotate(0)}
  71%{transform:rotate(-7deg)} 78%{transform:rotate(3.5deg)} 86%{transform:rotate(-1.2deg)} 94%,100%{transform:rotate(0)}
}
@keyframes ear-r{
  0%,40%{transform:rotate(0)} 50%{transform:rotate(-1.5deg)} 66%{transform:rotate(0)}
  72%{transform:rotate(6deg)} 79%{transform:rotate(-3deg)} 87%{transform:rotate(1deg)} 95%,100%{transform:rotate(0)}
}
@keyframes blink-lid{
  0%,22.8%,26.4%,100%{transform:translateY(0)}
  23.7%,25%{transform:translateY(58px)}
}
@keyframes blink-line{
  0%,23.5%,25.3%,100%{opacity:0}
  23.8%,24.9%{opacity:1}
}
@keyframes forge-light{
  0%,64%{opacity:.5} 67%{opacity:1} 86%,100%{opacity:.5}
}
@keyframes hot-glow{
  0%,65%{opacity:.7;transform:scale(1)}
  67%{opacity:1;transform:scale(1.18)}
  84%,100%{opacity:.7;transform:scale(1)}
}
@keyframes bar-flash{
  0%,65.8%{opacity:0} 66.4%{opacity:.95} 72%{opacity:.55} 86%,100%{opacity:0}
}
@keyframes impact-ring{
  0%,65.9%{opacity:0;transform:scale(.35)}
  66%{opacity:1;transform:scale(.45);animation-timing-function:ease-out}
  77%,100%{opacity:0;transform:scale(1.55)}
}
@keyframes impact-rays{
  0%,65.9%{opacity:0;transform:scale(.5)}
  66%{opacity:1;transform:scale(.7);animation-timing-function:ease-out}
  72%{opacity:.9;transform:scale(1.1)}
  78%,100%{opacity:0;transform:scale(1.25)}
}
/* Каждая искра летит по своему вектору --dx/--dy, потом падает и гаснет */
@keyframes spark{
  0%,65.9%{opacity:0;transform:translate(0,0) scale(1)}
  66%{opacity:1;transform:translate(0,0) scale(1.2);animation-timing-function:cubic-bezier(.1,.6,.3,1)}
  75%{opacity:1;transform:translate(var(--dx),var(--dy)) scale(1);animation-timing-function:cubic-bezier(.5,0,.9,.6)}
  86%{opacity:0;transform:translate(calc(var(--dx)*1.25),calc(var(--dy) + 18px)) scale(.35)}
  100%{opacity:0;transform:translate(0,0) scale(.35)}
}
@keyframes ember{
  0%{opacity:0;transform:translate(0,0)}
  15%{opacity:.8}
  100%{opacity:0;transform:translate(var(--drift,6px),-46px)}
}

/* Без анимации: застывшая поза на вершине замаха (40% цикла) */
@media (prefers-reduced-motion:reduce){
  .forge-svg *{
    animation-play-state:paused!important;
    animation-delay:calc(var(--cycle)*-0.4)!important;
  }
  .forge-svg .spark,.forge-svg .ember,.forge-svg .impact-ring,.forge-svg .impact-rays{display:none}
}
</style>
</head>
<body>

<div class="demo-frame">
<!-- ===================== КОМПОНЕНТ ===================== -->
<section class="forge" role="status" aria-live="polite">
  <div class="forge-scene">
    <!-- Внешний svg задаёт кадрирование; внутренний — систему координат 0 0 420 440,
         в которой записаны все точки суставов (transform-origin в CSS). -->
    <svg class="forge-svg" viewBox="-12 52 444 384" aria-hidden="true" focusable="false" xmlns="http://www.w3.org/2000/svg">
    <svg x="0" y="0" width="420" height="440" viewBox="0 0 420 440" overflow="visible">
      <defs>
        <!-- силуэт Бруно: широкий «мармеладный» корпус, голова и тело одно целое -->
        <path id="body-shape" d="M211 66C263 64 305 79 318 118C331 158 346 226 350 292C354 357 322 397 211 398C100 397 68 357 72 292C76 226 91 158 104 118C117 79 159 68 211 66Z"/>
        <clipPath id="clip-body"><use href="#body-shape"/></clipPath>
        <!-- всё, что ниже воротника — рубашка -->
        <clipPath id="clip-shirt"><path d="M40 205Q96 196 150 212Q178 222 211 255Q244 222 272 212Q326 196 382 205V318Q300 334 211 334Q122 334 40 318Z"/></clipPath>
        <clipPath id="clip-eye-l"><ellipse cx="164" cy="150" rx="27" ry="32" transform="rotate(-6 164 150)"/></clipPath>
        <clipPath id="clip-lid-l"><ellipse cx="164" cy="150" rx="29" ry="34" transform="rotate(-6 164 150)"/></clipPath>
        <clipPath id="clip-lid-r"><ellipse cx="258" cy="146" rx="29" ry="34" transform="rotate(6 258 146)"/></clipPath>
        <clipPath id="clip-eye-r"><ellipse cx="258" cy="146" rx="27" ry="32" transform="rotate(6 258 146)"/></clipPath>

        <radialGradient id="g-light" cx="166" cy="300" r="170" gradientUnits="userSpaceOnUse">
          <stop offset="0" stop-color="#ffa646" stop-opacity=".3"/>
          <stop offset=".5" stop-color="#ffa646" stop-opacity=".08"/>
          <stop offset="1" stop-color="#ffb35a" stop-opacity="0"/>
        </radialGradient>
        <radialGradient id="g-hot">
          <stop offset="0" stop-color="#ffd27a" stop-opacity=".9"/>
          <stop offset=".5" stop-color="#ff9a3d" stop-opacity=".35"/>
          <stop offset="1" stop-color="#ff9a3d" stop-opacity="0"/>
        </radialGradient>
        <linearGradient id="g-bar" x1="126" y1="0" x2="240" y2="0" gradientUnits="userSpaceOnUse">
          <stop offset="0" stop-color="#ffd877"/>
          <stop offset=".3" stop-color="#ffa338"/>
          <stop offset=".55" stop-color="#e2582a"/>
          <stop offset=".75" stop-color="#8b3a24"/>
          <stop offset="1" stop-color="#4c4542"/>
        </linearGradient>
        <linearGradient id="g-anvil" x1="0" y1="304" x2="0" y2="372" gradientUnits="userSpaceOnUse">
          <stop offset="0" stop-color="#6f7d84"/>
          <stop offset="1" stop-color="#4a575e"/>
        </linearGradient>
        <linearGradient id="g-steel" x1="0" y1="0" x2="1" y2="0">
          <stop offset="0" stop-color="#a9b6bb"/>
          <stop offset=".45" stop-color="#7a888f"/>
          <stop offset="1" stop-color="#55636a"/>
        </linearGradient>
      </defs>

      <!-- ===== ФОН: тёплое пятно и тень ===== -->
      <ellipse cx="211" cy="236" rx="186" ry="176" fill="#f6e9d8" opacity=".55"/>
      <ellipse cx="211" cy="424" rx="150" ry="9" fill="#6d5a45" opacity=".14"/>

      <!-- ===== НОГИ: стоят на месте, верх спрятан под корпусом ===== -->
      <g class="bruno-legs">
        <path d="M110 352H162L164 410Q164 422 151 422H121Q107 422 107 409Z" fill="#6c3520"/>
        <path d="M260 352H312L315 409Q315 422 301 422H271Q258 422 258 410Z" fill="#6c3520"/>
        <path d="M122 421L123 413M136 421V413M286 421V413M300 421L299 413" stroke="#55281a" stroke-width="3" stroke-linecap="round"/>
      </g>

      <!-- ===== ТЕЛО ===== -->
      <g class="bruno-body rig">
        <!-- уши (вторичное движение после удара) -->
        <g class="ear-l rig"><circle cx="118" cy="94" r="30" fill="#974e2b"/><circle cx="121" cy="97" r="16" fill="#73371f"/></g>
        <g class="ear-r rig"><circle cx="304" cy="90" r="30" fill="#974e2b"/><circle cx="301" cy="93" r="16" fill="#73371f"/></g>

        <use href="#body-shape" fill="#934a27"/>

        <!-- Рубашка: светлый лён, свободная (чуть шире силуэта) -->
        <g class="shirt" clip-path="url(#clip-shirt)">
          <use href="#body-shape" fill="#e3d6c6" stroke="#e3d6c6" stroke-width="5"/>
          <path d="M98 250Q94 280 100 306M324 250Q328 280 322 306" fill="none" stroke="#d3c4b2" stroke-width="4" stroke-linecap="round"/>
        </g>
        <!-- подол рубашки -->
        <path d="M66 316Q122 332 211 333Q300 332 356 316" fill="none" stroke="#d3c4b2" stroke-width="3.5" clip-path="url(#clip-body)"/>
        <!-- воротник и V-вырез со шнуровкой -->
        <path d="M84 206Q96 199 150 212Q178 222 211 255Q244 222 272 212Q326 199 338 206" fill="none" stroke="#f1e9de" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/>
        <path d="M150 215Q178 225 211 258Q244 225 272 215" fill="none" stroke="#d9cbbb" stroke-width="1.6"/>
        <path d="M198 230L224 244M224 230L198 244M203 240L220 252M220 240L203 252" stroke="#7a4b2c" stroke-width="2" stroke-linecap="round"/>

        <!-- Кожаный фартук: нагрудник, лямки, карман -->
        <g class="apron">
          <path d="M166 247Q150 228 114 211M256 247Q272 228 308 211" fill="none" stroke="#5b341e" stroke-width="14" stroke-linecap="round"/>
          <path d="M166 247Q150 228 114 211M256 247Q272 228 308 211" fill="none" stroke="#7d4c2d" stroke-width="10" stroke-linecap="round"/>
          <path d="M163 248Q211 241 259 248L264 308L284 384Q211 400 138 384L158 308Z" fill="#7a4a2b" stroke="#5b341e" stroke-width="2.5" stroke-linejoin="round"/>
          <path d="M168 254Q211 248 254 254L258 306L276 378" fill="none" stroke="#a77a51" stroke-width="1.6" stroke-dasharray="3 4" opacity=".75"/>
          <path d="M168 254L164 306L146 378" fill="none" stroke="#a77a51" stroke-width="1.6" stroke-dasharray="3 4" opacity=".75"/>
          <path d="M176 256Q178 280 172 300" fill="none" stroke="#8d5a37" stroke-width="3" stroke-linecap="round" opacity=".7"/>
          <!-- кармашек с мелком -->
          <rect x="213" y="252" width="5" height="14" rx="2" fill="#efe8dc" transform="rotate(10 215 259)"/>
          <path d="M193 262H233V281Q233 288 226 288H200Q193 288 193 281Z" fill="#6a3f25" stroke="#4f2e1b" stroke-width="1.5"/>
          <path d="M197 266H229M197 266V281Q197 284 200 284H226Q229 284 229 281V266" fill="none" stroke="#a77a51" stroke-width="1.3" stroke-dasharray="2.5 3"/>
          <circle cx="166" cy="248" r="3.6" fill="#d2a765"/><circle cx="256" cy="248" r="3.6" fill="#d2a765"/>
        </g>

        <!-- ===== ЛИЦО (едва заметно кивает после удара) ===== -->
        <g class="bruno-face rig">
          <ellipse cx="160" cy="138" rx="38" ry="40" transform="rotate(-14 160 138)" fill="#b26338"/>
          <ellipse cx="262" cy="134" rx="37" ry="39" transform="rotate(14 262 134)" fill="#b26338"/>

          <!-- ГЛАЗА: белки, зрачки смотрят на заготовку, веко = сосредоточенность -->
          <g class="bruno-eyes">
            <g clip-path="url(#clip-eye-l)">
              <ellipse cx="164" cy="150" rx="27" ry="32" transform="rotate(-6 164 150)" fill="#fffdf9"/>
              <ellipse class="pupil" cx="168" cy="160" rx="12.5" ry="18.5" transform="rotate(-6 168 160)" fill="#402a1d"/>
            </g>
            <g clip-path="url(#clip-lid-l)"><path class="eye-lid" d="M126 60H204V131L126 127Z" fill="#b26338"/></g>
            <g clip-path="url(#clip-eye-r)">
              <ellipse cx="258" cy="146" rx="27" ry="32" transform="rotate(6 258 146)" fill="#fffdf9"/>
              <ellipse class="pupil" cx="250" cy="157" rx="12.5" ry="18.5" transform="rotate(6 250 157)" fill="#402a1d"/>
            </g>
            <g clip-path="url(#clip-lid-r)"><path class="eye-lid" d="M218 56H296V123L218 127Z" fill="#b26338"/></g>
            <path class="eye-closed" d="M141 166Q164 176 188 165M234 162Q258 172 281 161" fill="none" stroke="#402a1d" stroke-width="4" stroke-linecap="round"/>
          </g>

          <!-- мордочка, нос, улыбка -->
          <path d="M211 146C221 146 228 153 231 163C241 168 247 181 245 195C243 210 229 219 211 219C193 219 179 210 177 195C175 181 181 168 191 163C194 153 201 146 211 146Z" fill="#d1864f"/>
          <path d="M194 167C194 158 228 158 228 167C228 176 217 185 211 185C205 185 194 176 194 167Z" fill="#3c261a"/>
          <path d="M207 194L208 197Q212 205 220 199" fill="none" stroke="#402a1d" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
        </g>
      </g>

      <!-- тёплый свет горна поверх корпуса -->
      <ellipse class="forge-light" cx="166" cy="300" rx="150" ry="110" fill="url(#g-light)"/>

      <!-- ===== НАКОВАЛЬНЯ НА ПНЕ ===== -->
      <g class="anvil">
        <!-- пень -->
        <path d="M156 366H266L270 414Q211 426 152 414Z" fill="#8a5530"/>
        <path d="M168 378Q166 396 170 412M196 374Q194 398 198 418M232 376Q236 398 232 418M256 374Q258 394 255 412" fill="none" stroke="#6a3d22" stroke-width="3" stroke-linecap="round" opacity=".7"/>
        <path d="M154 394Q211 403 268 394" fill="none" stroke="#56626a" stroke-width="6"/>
        <circle cx="170" cy="397" r="1.8" fill="#9aa6ab"/><circle cx="252" cy="397" r="1.8" fill="#9aa6ab"/>
        <ellipse cx="211" cy="366" rx="56" ry="6" fill="#b57e4c"/>
        <!-- сама наковальня: пятка слева, рог вправо -->
        <path d="M118 304H278C304 304 326 308 342 314C330 322 302 328 280 332C266 335 258 340 256 348L255 356C268 358 282 362 286 372H116C120 362 134 358 148 356L147 348C144 338 136 333 126 332L118 330Z" fill="url(#g-anvil)"/>
        <path d="M118 304H278C304 304 326 308 342 314L333 315C320 311 302 309 278 309H118Z" fill="#b9c5c9"/>
        <path d="M258 305.5H268V308H258Z" fill="#46535a"/>
        <path d="M148 356H255" stroke="#3f4b51" stroke-width="2.5" opacity=".6"/>
        <path d="M126 316H262" stroke="#86949a" stroke-width="2" stroke-linecap="round" opacity=".55"/>
      </g>

            <g class="hammer-wrist rig">
              <g transform="translate(106 278)">
                <!-- МОЛОТОК: ручка вдоль +x, центр бойка x=56, рабочая грань снизу (y=+20) -->

                <path d="M3 -15Q12 -12 14 -4M5 -5Q13 -3 14 5M4 5Q11 7 12 13" fill="none" stroke="#6f3519" stroke-width="2.5" stroke-linecap="round"/>
              </g>
            </g>
          </g>
        </g>
      </g>
