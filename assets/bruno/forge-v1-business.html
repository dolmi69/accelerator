<!doctype html>
<html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Бруно · Вариант 1 · Деловой костюм</title><style>
*{box-sizing:border-box}body{margin:0;min-height:100dvh;padding:24px;display:grid;place-items:center;background:#f5f4ef;color:#203640;font-family:system-ui,-apple-system,sans-serif}.sample{position:relative;width:min(100%,560px);height:660px;max-height:94dvh;border:1px solid #e1e7df;border-radius:24px;overflow:hidden}.variant-nav{position:absolute;top:18px;left:22px;right:22px;display:flex;justify-content:space-between;align-items:center;gap:12px;z-index:6;font-size:11px;color:#6c766a}.variant-nav a{color:inherit;text-underline-offset:3px}
/* Bruno's workshop covers the prototype for the entire generation request. */
.lab-empty-wrapper { position:relative; }
.lab-forge[hidden] { display:none; }
.lab-forge { position:absolute; inset:38px 0 0; z-index:5; display:flex; flex-direction:column; align-items:center; justify-content:center; padding:24px 18px; overflow:hidden; border-radius:0 0 14px 14px; background:radial-gradient(ellipse at 55% 45%,#fff0dc 0,#f6f7f1 55%,#eef4f0 100%); text-align:center; color:#203640; cursor:wait; }
.lab-empty-wrapper .lab-forge,.lab-viewer[open] .lab-forge { inset:0; border-radius:14px; }
.lab-forge-scene { width:min(100%,360px); flex:0 1 340px; min-height:0; display:flex; justify-content:center; }
.lab-forge-scene svg { display:block; width:100%; height:100%; max-height:42dvh; --forge-cycle:1.65s; }
.lab-forge-eyebrow { font-size:10px; font-weight:800; letter-spacing:.2em; color:#8e6036; margin-top:8px; }
.lab-forge h3 { font-size:clamp(19px,3vw,25px); margin:12px 0 8px; }
.lab-forge p { font-size:14px; line-height:1.6; max-width:320px; margin:0 0 18px; color:#60716d; }
.lab-forge small { color:#7c8276; font-size:11px; margin-top:14px; }
.lab-forge-progress { width:150px; height:4px; background:#dfdfd1; border-radius:10px; overflow:hidden; }
.lab-forge-progress span { display:block; width:45%; height:100%; background:#b97837; border-radius:10px; animation:forge-progress 1.8s ease-in-out infinite; }
/* Joint coordinates use the SVG viewBox. The steel face lands at (199, 305)
   at 64%; sparks, body weight and rebound share that same impact beat. */
.forge-upper-arm { transform-origin:164px 224px; animation:forge-shoulder var(--forge-cycle) infinite; }
.forge-forearm { transform-origin:112px 246px; animation:forge-elbow var(--forge-cycle) infinite; }
.forge-bear { transform-origin:232px 345px; animation:forge-body var(--forge-cycle) infinite; }
.forge-head { transform-origin:232px 218px; animation:forge-head var(--forge-cycle) infinite; }
.forge-tie { transform-origin:232px 228px; animation:forge-tie var(--forge-cycle) infinite; }
.forge-eyes { transform-origin:232px 160px; animation:forge-blink 6.6s infinite; }
.forge-sparks { opacity:0; transform-origin:199px 305px; animation:forge-spark var(--forge-cycle) infinite; }
.forge-impact { opacity:0; transform-origin:199px 305px; animation:forge-impact var(--forge-cycle) infinite; }
.forge-workpiece { animation:forge-heat var(--forge-cycle) infinite; }
@keyframes forge-shoulder {
  0%,100% { transform:rotate(8deg); animation-timing-function:cubic-bezier(.4,0,.25,1); }
  38% { transform:rotate(40deg); }
  45% { transform:rotate(43deg); animation-timing-function:cubic-bezier(.65,0,1,.6); }
  64%,66% { transform:rotate(0); animation-timing-function:ease-out; }
  76% { transform:rotate(5deg); }
}
@keyframes forge-elbow {
  0%,100% { transform:rotate(-28deg); animation-timing-function:cubic-bezier(.4,0,.25,1); }
  38% { transform:rotate(-155deg); }
  45% { transform:rotate(-157deg); animation-timing-function:cubic-bezier(.65,0,1,.6); }
  64%,66% { transform:rotate(0); animation-timing-function:ease-out; }
  76% { transform:rotate(-18deg); }
}
@keyframes forge-body { 0%,100% {transform:translateY(0)} 38%,45% {transform:translateY(-2px)} 64%,66% {transform:translateY(3px)} 78% {transform:translateY(0)} }
@keyframes forge-head { 0%,100% {transform:rotate(0)} 42% {transform:rotate(-1deg)} 65% {transform:rotate(1.5deg)} 80% {transform:rotate(0)} }
@keyframes forge-tie { 0%,38%,100% {transform:rotate(0)} 56% {transform:rotate(-3deg)} 69% {transform:rotate(4deg)} 85% {transform:rotate(-1deg)} }
@keyframes forge-spark { 0%,62%,86%,100% {opacity:0;transform:scale(.35)} 65% {opacity:1;transform:scale(.65)} 82% {opacity:0;transform:scale(1.65) translateY(-5px)} }
@keyframes forge-impact { 0%,62%,81%,100% {opacity:0;transform:scale(.5)} 65% {opacity:.9;transform:scale(.8)} 79% {opacity:0;transform:scale(1.65)} }
@keyframes forge-heat { 0%,59%,100% {stroke:#ec9b49} 65%,71% {stroke:#ffe1a0} }
@keyframes forge-blink { 0%,43%,47%,100% {transform:scaleY(1)} 45% {transform:scaleY(.08)} }
@keyframes forge-progress { 0% {transform:translateX(-100%)} 100% {transform:translateX(325%)} }
@media(prefers-reduced-motion:reduce) {
  .lab-forge svg g,.forge-workpiece,.lab-forge-progress span {animation:none!important}
  .forge-upper-arm {transform:rotate(8deg)}
  .forge-forearm {transform:rotate(-28deg)}
  .lab-forge-progress span {width:100%}
}

.sample .lab-forge{inset:0;border-radius:24px;padding-top:42px}
</style></head><body><main class="sample"><nav class="variant-nav"><span>Бруно · Вариант 1 · Деловой костюм</span><a href="forge-v2-blacksmith.html">Вариант 2 →</a></nav><div class="lab-forge" id="lab-forge" role="status" aria-live="polite" aria-atomic="true">

        <linearGradient id="forge-suit" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#354b55"/><stop offset="1" stop-color="#172b35"/></linearGradient>

        <path d="M192 207L180 233L194 241L184 254L229 307L209 238Z M271 207L286 233L270 242L282 254L235 307L255 238Z" fill="url(#forge-lapel)"/>

        <circle cx="271" cy="298" r="3" fill="#a8b6b7"/>

          <circle cx="174" cy="100" r="30" fill="#99532e"/><circle cx="174" cy="100" r="17" fill="#703a24"/>
          <circle cx="291" cy="100" r="30" fill="#99532e"/><circle cx="291" cy="100" r="17" fill="#703a24"/>

          <path d="M188 104Q231 84 270 104" stroke="#c4804d" stroke-width="4" opacity=".3" fill="none" stroke-linecap="round"/>
          <ellipse cx="199" cy="156" rx="29" ry="40" fill="#c57d45"/><ellipse cx="266" cy="156" rx="29" ry="40" fill="#c57d45"/>
          <g class="forge-eyes">
            <ellipse cx="201" cy="161" rx="22" ry="30" fill="#fffaf1"/><ellipse cx="264" cy="161" rx="22" ry="30" fill="#fffaf1"/>
            <ellipse cx="205" cy="165" rx="13" ry="20" fill="#35271f"/><ellipse cx="260" cy="165" rx="13" ry="20" fill="#35271f"/>
            <ellipse cx="201" cy="156" rx="4.5" ry="6" fill="white"/><ellipse cx="256" cy="156" rx="4.5" ry="6" fill="white"/>
          </g>
          <path d="M184 127Q198 120 212 128M252 128Q267 120 281 127" stroke="#764124" stroke-width="5" fill="none" stroke-linecap="round"/>
          <path d="M208 184Q212 169 232 169Q253 169 258 185L260 205Q253 222 232 223Q210 222 204 205Z" fill="#e2a466"/>
          <path d="M215 181Q232 173 250 181Q250 195 233 199Q217 195 215 181Z" fill="#402c20"/>

        <g class="forge-upper-arm">

        </g>
      </g>
      <path d="M176 350H284L294 405Q232 417 166 405Z" fill="url(#forge-wood)"/>

        <circle cx="166" cy="276" r="2"/><circle cx="233" cy="277" r="2"/>

    </svg>

  <span class="lab-forge-eyebrow">МАСТЕРСКАЯ БРУНО</span>
  <h3>Бруно куёт ваш сайт</h3>
